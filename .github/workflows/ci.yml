name: CI

# Go checks, browser tests against local test doubles and a multi-arch
# build without push. Pushing to ghcr.io follows with the release workflow.

on:
  pull_request:
  # main, tags and the weekly rebuild run this workflow from release.yml
  # before the image is pushed.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (default: the ref of the caller)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The realm test reads the test realm of the pinned PMSS release.
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum tidy
        run: go mod tidy -diff
      - name: Generated templ code up to date
        run: |
          go generate ./...
          if ! git diff --exit-code -- internal; then
            echo "Generated code differs; run go generate ./... and commit the result." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: generated-templ
          path: internal/**/*_templ.go
      - name: gofmt
        run: |
          unformatted=$(gofmt -l api cmd config internal)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test (unit and HTTP integration with test doubles)
        run: go test -race ./...
      - name: go build
        run: go build -trimpath -o /dev/null ./cmd/pmss-api-tester

  # Playwright flows (project chromium) against the OIDC and PMSS test
  # doubles in e2e/. The visual regression tests need the pinned container
  # and checked-in baselines and are not run here.
  e2e:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # Build only, no push.
  docker:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci-${{ github.sha }}
